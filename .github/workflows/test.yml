name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dependencies are declared as floors (mcp>=1.2,<2, requests>=2.31, pydantic>=2.0),
  # so a green badge only proves the package installed on the day of the last commit.
  # Between 2026-05-02 and 2026-08-10 nothing re-ran, and in that window `mcp` 2.0
  # dropped `mcp.server.fastmcp` — the console script was broken for months while CI
  # still showed green. The weekly run re-resolves the dependency tree and fails loudly.
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint with ruff
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Run pytest
        run: pytest -v
